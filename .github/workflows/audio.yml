name: Generate Voice Announcements

on:
  push:
    branches: [main]
    paths:
      - 'tools/audio-generation/manifest.json'
      - 'tools/audio-generation/generate_time_announcements.py'
      - 'tools/audio-generation/requirements.txt'
      - '.github/workflows/audio.yml'
  pull_request:
    paths:
      - 'tools/audio-generation/manifest.json'
      - 'tools/audio-generation/generate_time_announcements.py'
      - 'tools/audio-generation/requirements.txt'
      - '.github/workflows/audio.yml'
  workflow_dispatch:

jobs:
  generate:
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Set up Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tools/audio-generation/requirements.txt

      - name: Install pinned generator dependency
        shell: pwsh
        run: python -m pip install --requirement tools/audio-generation/requirements.txt

      - name: Generate all announcements
        shell: pwsh
        run: |
          python tools/audio-generation/generate_time_announcements.py --output-dir dist/generated-audio
          $files = @(Get-ChildItem dist/generated-audio -Filter 'Time_??_??.mp3' -File)
          if ($files.Count -ne 48) { throw "Expected 48 MP3 files; found $($files.Count)." }
          if (($files.Name | Sort-Object -Unique).Count -ne 48) { throw 'Generated filenames are not unique.' }

      - name: Upload generated announcements
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: generated-time-announcements
          path: dist/generated-audio/*.mp3
          if-no-files-found: error
